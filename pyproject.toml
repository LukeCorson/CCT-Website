[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cct-control"
version = "0.5.0"
description = "A local laboratory workstation for automated CCT breakthrough experiments"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13.7,<0.15",
  "numpy>=1.26,<3",
  "pyserial>=3.5,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.gui-scripts]
cct-control = "cct.app:main"
cct-web = "cct.web.app:main"

[tool.setuptools.packages.find]
include = ["cct*"]

